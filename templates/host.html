<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Host Startup Game</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0b1120; color: #eef2ff; padding: 20px; margin: 0; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; }
        .panel { background: #1e293b; border-radius: 24px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { background: #ec4899; border: none; padding: 10px 24px; border-radius: 30px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; transition: transform 0.1s, opacity 0.1s; }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        button:active { transform: scale(0.98); }
        .flex { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .rankings { display: grid; gap: 12px; margin-top: 16px; }
        .rank-card { background: #0f172a; border-radius: 16px; padding: 16px; border-left: 4px solid #ec4899; transition: all 0.2s; }
        .rank-card h3 { margin: 0 0 8px 0; color: #fbcfe8; }
        .rank-card .status-ended { opacity: 0.6; border-left-color: #6b7280; }
        .logs { background: #00000066; border-radius: 16px; padding: 12px; max-height: 350px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; margin-top: 16px; }
        .logs div { padding: 4px 0; border-bottom: 1px solid #334155; }
        .link-item { background: #0f172a; padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; word-break: break-all; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .link-item a { color: #ec4899; text-decoration: none; }
        .link-item a:hover { text-decoration: underline; }
        .link-item button { padding: 6px 12px; font-size: 12px; background: #334155; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-waiting { background: #f59e0b; color: #1e293b; }
        .status-playing { background: #22c55e; color: #1e293b; }
        .status-ended { background: #6b7280; }
        input, select { background: #0f172a; border: 1px solid #334155; padding: 10px 14px; border-radius: 12px; color: white; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #ec4899; }
        h2, h3 { margin-top: 0; }
        .room-info { background: #0f172a; padding: 16px; border-radius: 16px; margin-bottom: 16px; }
        .copy-all { background: #334155; margin-left: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div id="setupPanel" class="panel">
        <h2>🎮 TẠO PHÒNG CHƠI</h2>
        <div class="flex">
            <label>Số người chơi (2-10):</label>
            <input type="number" id="numPlayers" min="2" max="10" value="4" style="width: 80px;">
            <button id="createRoomBtn">🚀 Tạo phòng</button>
        </div>
    </div>

    <div id="gamePanel" style="display:none;" class="panel">
        <div class="room-info">
            <h2>🏠 PHÒNG: <span id="roomId" style="color: #ec4899;"></span></h2>
            <p>👥 Trạng thái: <span id="playerCount"></span> / <span id="maxPlayers"></span> đã tham gia</p>
            <div class="status-badge" id="gameStatus">Đang chờ</div>
        </div>
        
        <h3>🔗 LINK MỜI NGƯỜI CHƠI:</h3>
        <div id="joinLinksList" style="background: #0f172a; border-radius: 16px; padding: 16px; margin-bottom: 20px;">
        </div>
        
        <h3>🏆 BẢNG XẾP HẠNG</h3>
        <div id="rankings" class="rankings">Đang tải...</div>
        
        <h3>📜 NHẬT KÝ TRÒ CHƠI</h3>
        <div id="logsArea" class="logs"></div>
        
        <div id="phaseControl" style="margin-top: 20px; text-align: center;">
            <button id="runPhaseBtn" style="display:none; background: #22c55e; font-size: 18px; padding: 12px 32px;">▶ CHẠY PHASE TIẾP THEO</button>
            <div id="waitingMsg" style="display:none; color: #f59e0b; padding: 10px;">⏳ Đợi người chơi sẵn sàng...</div>
        </div>
    </div>
</div>

<script>
    let roomId = null;
    let interval = null;

    document.getElementById('createRoomBtn').onclick = async () => {
        let num = parseInt(document.getElementById('numPlayers').value);
        let res = await fetch('/api/create_room', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({num_players: num})
        });
        let data = await res.json();
        roomId = data.room_id;
        
        let linksHtml = '';
        data.join_links.forEach((link, idx) => {
            linksHtml += `<div class="link-item">
                            <span>🎮 Player ${idx+1}:</span>
                            <a href="${link}" target="_blank">${link}</a>
                            <button class="copy-link-btn" data-link="${link}">📋 Sao chép</button>
                          </div>`;
        });
        document.getElementById('joinLinksList').innerHTML = linksHtml;
        
        document.querySelectorAll('.copy-link-btn').forEach(btn => {
            btn.onclick = () => {
                const link = btn.getAttribute('data-link');
                navigator.clipboard.writeText(link).then(() => alert('✅ Đã sao chép link!'));
            };
        });
        
        document.getElementById('roomId').innerText = roomId;
        document.getElementById('maxPlayers').innerText = num;
        document.getElementById('setupPanel').style.display = 'none';
        document.getElementById('gamePanel').style.display = 'block';
        startPolling();
    };

    async function startPolling() {
        if (interval) clearInterval(interval);
        interval = setInterval(async () => {
            try {
                let res = await fetch(`/api/host_state?room_id=${roomId}`);
                let state = await res.json();
                
                document.getElementById('playerCount').innerText = state.players_joined;
                
                // Cập nhật status badge
                let statusBadge = document.getElementById('gameStatus');
                if (state.status === 'waiting') {
                    statusBadge.innerHTML = '⏳ Đang chờ người chơi';
                    statusBadge.className = 'status-badge status-waiting';
                } else if (state.status === 'choosing_deck') {
                    statusBadge.innerHTML = '🎴 Đang chọn bài';
                    statusBadge.className = 'status-badge status-waiting';
                } else if (state.status === 'playing') {
                    statusBadge.innerHTML = `🎮 Đang chơi - Phase ${state.phase}/${state.max_phase}`;
                    statusBadge.className = 'status-badge status-playing';
                } else if (state.status === 'ended') {
                    statusBadge.innerHTML = '🏆 KẾT THÚC';
                    statusBadge.className = 'status-badge status-ended';
                }
                
                // Cập nhật rankings
                if (state.rankings) {
                    let html = '';
                    state.rankings.forEach((p, idx) => {
                        let endedClass = p.status === 'ended' ? 'status-ended' : '';
                        let fundingPercent = (p.funding * 100).toFixed(1);
                        html += `<div class="rank-card ${endedClass}">
                            <h3>👤 Player ${idx+1}: ${p.name}</h3>
                            <div>💰 Funding: ${fundingPercent}%</div>
                            <div>📊 Hype: ${p.hype || 50} | Transparency: ${p.transparency || 50}</div>
                            <div>🏅 Điểm: ${p.score?.toFixed(2) || '0.00'}</div>
                            <div>📏 Scale: ${p.scale || 'M'}</div>
                            ${p.status === 'ended' ? '<div>✅ Đã kết thúc</div>' : ''}
                            ${p.status === 'not_joined' ? '<div>⏳ Chưa tham gia</div>' : ''}
                        </div>`;
                    });
                    document.getElementById('rankings').innerHTML = html;
                }
                
                // Cập nhật logs
                if (state.logs && state.logs.length) {
                    let logsHtml = state.logs.slice().reverse().map(l => `<div>${l}</div>`).join('');
                    document.getElementById('logsArea').innerHTML = logsHtml;
                }
                
                // Cập nhật nút Run Phase
                let runBtn = document.getElementById('runPhaseBtn');
                let waitingMsg = document.getElementById('waitingMsg');
                
                if (state.status === 'playing' && !state.game_ended) {
                    if (state.all_ready) {
                        runBtn.style.display = 'inline-block';
                        waitingMsg.style.display = 'none';
                        runBtn.innerText = `▶ CHẠY PHASE ${state.phase}`;
                    } else {
                        runBtn.style.display = 'none';
                        waitingMsg.style.display = 'block';
                        waitingMsg.innerText = `⏳ Đợi người chơi sẵn sàng... (Phase ${state.phase})`;
                    }
                } else {
                    runBtn.style.display = 'none';
                    waitingMsg.style.display = 'none';
                }
                
                if (state.game_ended) {
                    clearInterval(interval);
                    alert('🏆 TRÒ CHƠI KẾT THÚC! 🏆\nXem bảng xếp hạng để biết kết quả.');
                }
            } catch (err) {
                console.error('Polling error:', err);
            }
        }, 2000);
    }

    document.getElementById('runPhaseBtn').onclick = async () => {
        try {
            let res = await fetch('/api/run_phase', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({room_id: roomId})
            });
            let data = await res.json();
            if (data.ended || data.game_ended) {
                alert('🏆 GAME KẾT THÚC! 🏆');
                clearInterval(interval);
            }
            document.getElementById('runPhaseBtn').style.display = 'none';
        } catch (err) {
            alert('Lỗi: ' + err.message);
        }
    };
</script>
</body>
</html>
