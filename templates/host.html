<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Host Startup Game</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0b1120; color: #eef2ff; padding: 20px; margin: 0; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; }
        .panel { background: #1e293b; border-radius: 24px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { background: #ec4899; border: none; padding: 10px 24px; border-radius: 30px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; transition: transform 0.1s, opacity 0.1s; }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        button:active { transform: scale(0.98); }
        .flex { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .rankings { display: grid; gap: 12px; margin-top: 16px; }
        .rank-card { background: #0f172a; border-radius: 16px; padding: 16px; border-left: 4px solid #ec4899; transition: all 0.2s; }
        .rank-card h3 { margin: 0 0 8px 0; color: #fbcfe8; }
        .rank-card .status-ended { opacity: 0.6; border-left-color: #6b7280; }
        .logs { background: #00000066; border-radius: 16px; padding: 12px; max-height: 350px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; margin-top: 16px; }
        .logs div { padding: 4px 0; border-bottom: 1px solid #334155; }
        .link-item { background: #0f172a; padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; word-break: break-all; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .link-item a { color: #ec4899; text-decoration: none; }
        .link-item a:hover { text-decoration: underline; }
        .link-item button { padding: 6px 12px; font-size: 12px; background: #334155; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-waiting { background: #f59e0b; color: #1e293b; }
        .status-playing { background: #22c55e; color: #1e293b; }
        .status-ended { background: #6b7280; }
        input, select { background: #0f172a; border: 1px solid #334155; padding: 10px 14px; border-radius: 12px; color: white; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #ec4899; }
        h2, h3 { margin-top: 0; }
        .room-info { background: #0f172a; padding: 16px; border-radius: 16px; margin-bottom: 16px; }
        .copy-all { background: #334155; margin-left: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div id="setupPanel" class="panel">
        <h2>🎮 TẠO PHÒNG CHƠI</h2>
        <div class="flex">
            <label>Số người chơi (2-10):</label>
            <input type="number" id="numPlayers" min="2" max="10" value="4" style="width: 80px;">
            <button id="createRoomBtn">🚀 Tạo phòng</button>
        </div>
    </div>

    <div id="gamePanel" style="display:none;" class="panel">
        <div class="room-info">
            <h2>🏠 PHÒNG: <span id="roomId" style="color: #ec4899;"></span></h2>
